<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>LeetWeave Scribe — Glassmorphism UI Showcase</title>
  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090714;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
    }
    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(135deg, #2dd4bf, #8b5cf6, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.subtitle {
      margin: -24px 0 20px;
      color: rgba(255, 255, 255, 0.6);
      font-size: 14px;
    }
    .grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 36px;
      max-width: 1200px;
    }
    .showcase-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .showcase-label {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.7);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .frame-popup {
      width: 360px;
      height: 540px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <h1>LeetWeave Scribe — Glassmorphic Design Showcase</h1>
  <p class="subtitle">Dark frosted glass, ambient glowing orbs, luminous pills, and refined micro-interactions</p>

  <div class="grid">
    <div class="showcase-item">
      <div class="showcase-label">1. Popup — Dashboard View</div>
      <div class="frame-popup">
        <iframe src="dist/popup/popup.html"></iframe>
      </div>
    </div>
  </div>
</body>
</html>
