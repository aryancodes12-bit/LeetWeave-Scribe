<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>LeetWeave Scribe</title>
  <style>
    :root {
      --gh-bg:#0d1117; --gh-canvas:#f6f8fa; --gh-border:#d0d7de;
      --gh-fg:#1f2328; --gh-fg-muted:#59636e;
      --gh-green:#1a7f37; --gh-green-dark:#238636;
      --easy:#00af9b; --medium:#ffa116; --hard:#ef4743;
      --mono: ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace;
      --sans: -apple-system,"Segoe UI",sans-serif;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    body {
      width: 360px; margin: 0; font-family: var(--sans);
      font-size: 13px; color: var(--gh-fg); background: #fff;
    }

    /* Header (matches mockup's dark header block) */
    .ext-header {
      padding: 16px 18px 14px; background: var(--gh-fg); color: #fff;
      display: flex; align-items: center; gap: 10px;
    }
    .ext-logo {
      width: 26px; height: 26px; border-radius: 7px;
      background: linear-gradient(135deg,#238636,#2ea043);
      display: flex; align-items: center; justify-content: center; font-size: 14px;
      flex-shrink: 0;
    }
    .ext-header-text h1 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
    .ext-header-text p { margin: 1px 0 0; font-size: 11px; color: #8b949e; }
    .ext-status-row {
      margin-left: auto; display: flex; align-items: center; gap: 5px;
      font-size: 11px; color: #7ee787; font-weight: 500; white-space: nowrap;
    }
    .ext-status-row.disconnected { color: #f0883e; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #3fb950; box-shadow: 0 0 0 3px rgba(63,185,80,.2); }
    .dot.off { background: #f0883e; box-shadow: 0 0 0 3px rgba(240,136,62,.2); }

    .ext-body { padding: 16px 18px 18px; }

    /* Repo chip */
    .repo-chip {
      display: flex; align-items: center; gap: 8px; padding: 9px 12px;
      background: var(--gh-canvas); border: 1px solid var(--gh-border); border-radius: 8px;
      font-family: var(--mono); font-size: 12px; color: var(--gh-fg); margin-bottom: 14px;
    }
    .repo-chip svg { flex-shrink: 0; color: var(--gh-fg-muted); }

    /* Stat grid */
    .stat-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 16px; }
    .stat-card { background: var(--gh-canvas); border: 1px solid var(--gh-border); border-radius: 8px; padding: 10px 6px; text-align: center; }
    .stat-num { font-family: var(--mono); font-size: 18px; font-weight: 700; color: var(--gh-fg); }
    .stat-label { font-size: 10px; color: var(--gh-fg-muted); margin-top: 2px; text-transform: uppercase; letter-spacing: .04em; }

    /* Difficulty bars */
    .diff-bars { margin-bottom: 16px; }
    .diff-row { display: flex; align-items: center; gap: 8px; font-size: 11px; margin-bottom: 6px; }
    .diff-row .diff-label { width: 52px; color: var(--gh-fg-muted); font-weight: 600; }
    .diff-row .bar-track { flex: 1; height: 6px; background: var(--gh-canvas); border-radius: 4px; overflow: hidden; }
    .diff-row .bar-fill { height: 100%; border-radius: 4px; }
    .diff-row .diff-count { width: 52px; text-align: right; color: var(--gh-fg-muted); font-family: var(--mono); font-size: 10px; }

    /* Last sync box */
    .last-sync {
      display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px;
      background: #f0fdf4; border: 1px solid #bbf0cd; border-radius: 8px; margin-bottom: 14px;
    }
    .last-sync svg { flex-shrink: 0; margin-top: 1px; color: var(--gh-green-dark); }
    .last-sync-text { font-size: 11.5px; line-height: 1.4; }
    .last-sync-text strong { display: block; color: var(--gh-fg); font-weight: 600; }
    .last-sync-text span { color: var(--gh-fg-muted); }

    /* Time saved box */
    .time-saved {
      display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px;
      background: #eef4ff; border: 1px solid #cfe0ff; border-radius: 8px; margin-bottom: 14px;
    }
    .time-saved svg { flex-shrink: 0; margin-top: 1px; color: #0969da; }
    .time-saved-text { font-size: 11.5px; line-height: 1.4; }
    .time-saved-text strong { display: block; color: var(--gh-fg); font-weight: 600; }
    .time-saved-text span { color: var(--gh-fg-muted); }

    .empty-state {
      text-align: center; padding: 20px 10px; color: var(--gh-fg-muted); font-size: 12px;
      background: var(--gh-canvas); border: 1px dashed var(--gh-border); border-radius: 8px; margin-bottom: 16px;
    }

    /* Buttons */
    .ext-footer { display: flex; gap: 8px; }
    button {
      flex: 1; padding: 9px 10px; border-radius: 7px; font-size: 12.5px; font-weight: 600;
      text-align: center; cursor: pointer; border: 1px solid var(--gh-border); background: #fff;
      color: var(--gh-fg); font-family: inherit;
    }
    button.primary { background: var(--gh-green-dark); border-color: var(--gh-green-dark); color: #fff; }
    button.full-width { width: 100%; margin-top: 0; }

    /* Setup form */
    label { display: block; font-size: 11px; font-weight: 600; color: var(--gh-fg-muted); margin: 12px 0 4px; }
    label:first-child { margin-top: 0; }
    input, select {
      width: 100%; padding: 7px 9px; border: 1px solid var(--gh-border); border-radius: 6px;
      font-size: 12.5px; font-family: inherit; color: var(--gh-fg);
    }
    .row { display: flex; gap: 8px; }
    .row > div { flex: 1; }
    #status { font-size: 11.5px; margin-top: 10px; min-height: 14px; }
    #status.error { color: #c0362c; }
    #status.success { color: var(--gh-green); }
    .hint { font-size: 11px; color: var(--gh-fg-muted); margin-top: 10px; line-height: 1.5; }
    .hint a { color: #0969da; text-decoration: none; }
    .setup-save { margin-top: 14px; }
  </style>
</head>
<body>
  <header class="ext-header">
    <div class="ext-logo">🔗</div>
    <div class="ext-header-text">
      <h1>LeetWeave Scribe</h1>
      <p id="header-subtitle">Not connected</p>
    </div>
    <div class="ext-status-row disconnected" id="status-row">
      <span class="dot off" id="status-dot"></span>
      <span id="status-text">Disconnected</span>
    </div>
  </header>
  <main class="ext-body" id="app"></main>
  <script type="module" src="popup.js"></script>
</body>
</html>
